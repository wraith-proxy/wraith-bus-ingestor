name: Deploy Gitea Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    # Moved off ubuntu-latest 2026-09-24 (ROADMAP.md had flagged this as
    # possible independently of any dbt version since 1.5.0's Debian
    # switch, just never done). ghost-runner (see ci-images) now bakes this
    # repo's own deps -- mkdocs, genbadge, pydoc-markdown, poethepoet,
    # pytest, dbt-core/dbt-duckdb, all of it -- so this job needs no
    # "install uv" or "install dependencies" step at all, unlike the old
    # ubuntu-latest run which resolved and installed everything fresh every
    # time. Rebuild ci-images when pyproject.toml changes.
    runs-on: ghost-runner
    steps:
      - uses: actions/checkout@v4

      - name: Run Tests & Coverage
        run: pytest --cov=backend --cov-report=xml

      - name: Generate Coverage Badge
        run: genbadge coverage -i coverage.xml -o docs/coverage.svg

      - name: Generate Python API docs
        run: poe docs-api

      - name: Generate dbt docs
        # dbt docs are generated LOCALLY, against real live data, and
        # committed -- this runner has neither QuestDB nor the NaPTAN
        # register, so its own catalog would be sparse (or, before
        # ensure_ci_fixtures.py, would fail outright on the empty source
        # glob). If docs/dbt/index.html is already committed, use it as-is;
        # only fall back to generating one here if it's genuinely missing.
        run: |
          if [ -f docs/dbt/index.html ]; then
            echo "docs/dbt/index.html already committed -- skipping regeneration"
          else
            poe docs-dbt
          fi

      - name: Build Documentation
        run: mkdocs build

      - name: Sync to Main Website Repo
        env:
          MY_TOKEN: ${{ secrets.GITEATOKEN }}
          MY_URL: ${{ secrets.GITEAURL }}

        run: |
          # 1. Clone the main website repo
          CLEAN_URL=${MY_URL#*//}
          git clone https://${MY_TOKEN}@${CLEAN_URL}/thomaspeoples/ghost-site.git main_site

          # 2. Create the target directory if it doesn't exist.
          # NOTE: ghost-site's docroot split (2026-09) moved this from
          # main_site/www/gitea-repos/ to main_site/www/thomaspeoples/gitea-repos/
          # -- thomaspeoples.com now roots at www/thomaspeoples/ only. Every
          # OTHER wraith-* repo's pages.yml still targets the old path and is
          # silently writing to a location nginx no longer serves.
          TARGET_DIR="main_site/www/thomaspeoples/gitea-repos/wraith-bus-ingestor"
          mkdir -p $TARGET_DIR

          # 3. Clean and Copy
          rm -rf $TARGET_DIR/*
          cp -r site/* $TARGET_DIR/

          # 4. Commit and Push to the OTHER repo
          cd main_site
          git config user.name "Ghost Runner"
          git config user.email "runner@ghost-stack.local"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to documentation. Skipping commit."
          else
            git commit -m ":books: main: Update docs for wraith-bus-ingestor: ${{ gitea.sha }}"
            git push origin main
          fi
