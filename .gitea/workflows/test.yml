name: Wraith Bus Ingestor CI

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  test-and-verify:
    runs-on: ghost-runner
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        # ghost-runner moved from Alpine/musl to Debian/glibc 2026-09-17 (see
        # ci-images) specifically because duckdb and dbt both distribute as
        # binary-wheel-only packages with no musllinux target at all -- no
        # toolchain ever fixed that. Both are real glibc wheels now, so
        # --all-extras (not just --extra duckdb) works here. `--system`
        # still doesn't apply: uv manages its own venv same as before.
        run: uv sync --all-extras
      - name: Run Tests
        run: |
          chmod +x bin/run_tests.sh
          ./bin/run_tests.sh
        env:
          PYTHONPATH: .
      - name: Validate data contracts
        # No live QuestDB or built marts file exists on this runner, so most
        # checks here degrade to a graceful skip -- see validate.py's own
        # handling of an unreachable engine. What this step actually catches
        # is a syntax/structure error in the ODCS contracts or the ontology
        # YAML itself (yaml.safe_load runs eagerly, before any skip decision).
        # The gate that checks real data is dbt/build.sh, which runs this
        # same script against the live marts before every publish.
        run: uv run python3 contracts/validate.py
      - name: dbt build + test (Learn dbt sandbox)
        # ROADMAP.md 1.1.0. Same limitation as "Validate data contracts"
        # above -- no live QuestDB or NaPTAN register on this runner -- so
        # this runs against ops/dbt_sandbox.sh's throwaway project instead: a
        # copy of dbt/ with its own warehouse, fed from the two committed
        # fixtures under dbt/tests/fixtures/ (the same ones docs/learn-dbt/
        # walks through from a fresh clone). That makes this a real `dbt run`
        # + `dbt test` against real (if synthetic) data, not a syntax check --
        # it catches a broken model or a failing assertion, which "Validate
        # data contracts" cannot. ghost-runner can run dbt at all only since
        # its 2026-09-17 move to Debian/glibc (see ci-images); dbt-core and
        # dbt-duckdb are already in .venv from "Install dependencies" above.
        run: |
          set -euo pipefail
          DEST="$(mktemp -d)/dbt-sandbox"
          ./ops/dbt_sandbox.sh "$DEST"
          export PATH="$PWD/.venv/bin:$PATH"
          export DBT_PROFILES_DIR="$DEST"
          cd "$DEST"
          dbt run
          dbt test

  auto-merge:
    needs: test-and-verify
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Central Merge Action
        uses: https://git.thomaspeoples.com/thomaspeoples/ci-actions/auto-merge@main
        with:
          gitea_token: ${{ secrets.giteatoken }}
          api_url: "${{ secrets.giteaurl }}/api/v1"
