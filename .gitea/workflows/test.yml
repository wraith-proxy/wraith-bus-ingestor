name: Wraith Bus Ingestor CI

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  test-and-verify:
    runs-on: ghost-runner
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No "Install dependencies" step: ghost-runner (see ci-images) bakes
      # this repo's own runtime + dev deps, and its dbt packages, into the
      # image at build time now -- `uv sync` used to re-resolve and
      # reinstall all of it into a fresh project-local .venv on every single
      # run regardless of what the image already had baked --system,
      # which is why baking duckdb/dbt-core here in the first place (2026-
      # 09-17) never actually sped this repo's CI up until now. Rebuild
      # ci-images when this repo's pyproject.toml or dbt/packages.yml
      # changes -- same deliberate tradeoff already made for the dbt/duckdb
      # version pins baked there.
      - name: Run Tests
        run: |
          chmod +x bin/run_tests.sh
          ./bin/run_tests.sh --no-venv
        env:
          PYTHONPATH: .
      - name: Python API reference in sync
        # docs/api/*.md are generated from the docstrings and committed so the nav
        # works without a build. Regenerate; any difference (or a missing/untracked page)
        # means someone changed a docstring without running `poe docs-api`.
        run: |
          set -euo pipefail
          poe docs-api
          if [ -n "$(git status --porcelain -- docs/api)" ]; then
            git status --short -- docs/api
            git diff --stat -- docs/api
            echo "docs/api is stale: run 'poe docs-api' and commit docs/api" >&2
            exit 1
          fi
      - name: Docs build (strict)
        # Same site the Pages job publishes, but failing on any warning here, before merge.
        run: mkdocs build --strict
      - name: Validate data contracts
        # No live QuestDB or built marts file exists on this runner, so most
        # checks here degrade to a graceful skip -- see validate.py's own
        # handling of an unreachable engine. What this step actually catches
        # is a syntax/structure error in the ODCS contracts or the ontology
        # YAML itself (yaml.safe_load runs eagerly, before any skip decision).
        # The gate that checks real data is dbt/build.sh, which runs this
        # same script against the live marts before every publish.
        run: python3 contracts/validate.py
      - name: Generated files in sync (modelgen check)
        # modelgen 0.16.0 is baked into the image. `modelgen check` fails when a
        # generated file was hand-edited or no longer matches its contract.
        # when check fails, validate.py --generated arbitrates: same comparison
        # but a header-only modelgen version difference passes (check_generated).
        run: |
          set -euo pipefail
          modelgen check --from-contract --diff || python3 contracts/validate.py --generated
      - name: Contract change policy (expand/contract)
        # Compares each contract changed on this branch with its version on
        # origin/main: breaking change without a major bump, removal before its
        # sunset date, new column without a backfill. A contract that does not
        # exist on main yet has nothing to compare against and is skipped.
        # Reader detection over compiled SQL is not wired in yet (needs a
        # `dbt compile`); see contracts/policy.py.
        run: |
          set -euo pipefail
          for f in contracts/*.odcs.yaml; do
            base="$(mktemp)"
            if git show "origin/main:$f" > "$base" 2>/dev/null; then
              echo "policy: $f"
              python3 contracts/policy.py "$base" "$f"
            fi
          done
      - name: Contract change policy (deleted contracts)
        # A whole contract file deleted on this branch is never reached by the
        # loops above. Fails; an intentional deletion needs the owner to bump
        # this workflow.
        run: |
          set -euo pipefail
          ls_file="$(mktemp)"
          git ls-tree --name-only origin/main contracts/ > "$ls_file"
          python3 contracts/policy.py --deleted "$ls_file" .
      - name: Contract change policy (compiled readers)
        # Same comparison as the step above, plus reader detection: the sandbox
        # is compiled so policy.py can scan the compiled SQL for readers.
        run: |
          set -euo pipefail
          DEST="$(mktemp -d)/dbt-sandbox"
          ./ops/dbt_sandbox.sh "$DEST"
          (cd "$DEST" && dbt compile)
          for f in contracts/*.odcs.yaml; do
            base="$(mktemp)"
            if git show "origin/main:$f" > "$base" 2>/dev/null; then
              python3 contracts/policy.py "$base" "$f" "$DEST/target/compiled"
            fi
          done
      - name: dbt build + test (Learn dbt sandbox)
        # ROADMAP.md 1.1.0. Same limitation as "Validate data contracts"
        # above -- no live QuestDB or NaPTAN register on this runner -- so
        # this runs against ops/dbt_sandbox.sh's throwaway project instead: a
        # copy of dbt/ with its own warehouse, fed from the two committed
        # fixtures under dbt/tests/fixtures/ (the same ones docs/learn-dbt/
        # walks through from a fresh clone). That makes this a real `dbt run`
        # + `dbt test` against real (if synthetic) data, not a syntax check --
        # it catches a broken model or a failing assertion, which "Validate
        # data contracts" cannot. dbt itself and its packages (dbt_expectations,
        # dbt_date) are both baked into the image; dbt_sandbox.sh copies the
        # baked packages rather than fetching them, and falls back to the
        # system dbt on PATH since there is no .venv on this runner any more.
        run: |
          set -euo pipefail
          DEST="$(mktemp -d)/dbt-sandbox"
          ./ops/dbt_sandbox.sh "$DEST"
          cd "$DEST"
          dbt run
          dbt test
      - name: SQL ratchet (hand-written model SQL)
        # Fails when non-blank model SQL code lines (comments stripped) exceed
        # ops/sql_baseline.txt. Raw line count is recorded there, not gated.
        run: python3 ops/sql_ratchet.py

  auto-merge:
    needs: test-and-verify
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Central Merge Action
        uses: https://git.thomaspeoples.com/thomaspeoples/ci-actions/auto-merge@main
        with:
          gitea_token: ${{ secrets.giteatoken }}
          api_url: "${{ secrets.giteaurl }}/api/v1"
