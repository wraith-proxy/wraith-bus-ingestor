name: Wraith Bus Ingestor CI

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  test-and-verify:
    runs-on: ghost-runner
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        # uv itself is already on ghost-runner. `--system` doesn't work here
        # anyway: ghost-runner's Python is apk-managed (PEP 668), and uv
        # refuses to touch an externally-managed interpreter without
        # --break-system-packages. duckdb compiles fine now that it's baked
        # into the ghost-runner image (see ci-images) -- but NOT --all-extras:
        # that also pulls the `dbt` extra, and dbt-core-experimental-parser
        # (one of dbt-core's own hard deps) ships no musllinux wheel and
        # refuses to build from source at all, on any platform, without a
        # matching prebuilt binary. No image fixes that; dbt genuinely can't
        # run on this runner. Not needed here anyway -- dbt docs generate
        # already runs on ubuntu-latest (glibc) in pages.yml.
        run: uv sync --extra dev --extra duckdb
      - name: Run Tests
        run: |
          chmod +x bin/run_tests.sh
          ./bin/run_tests.sh
        env:
          PYTHONPATH: .
      - name: Validate data contracts
        # No live QuestDB or built marts file exists on this runner, so most
        # checks here degrade to a graceful skip -- see validate.py's own
        # handling of an unreachable engine. What this step actually catches
        # is a syntax/structure error in the ODCS contracts or the ontology
        # YAML itself (yaml.safe_load runs eagerly, before any skip decision).
        # The gate that checks real data is dbt/build.sh, which runs this
        # same script against the live marts before every publish.
        run: uv run python3 contracts/validate.py

  auto-merge:
    needs: test-and-verify
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Central Merge Action
        uses: https://git.thomaspeoples.com/thomaspeoples/ci-actions/auto-merge@main
        with:
          gitea_token: ${{ secrets.giteatoken }}
          api_url: "${{ secrets.giteaurl }}/api/v1"
