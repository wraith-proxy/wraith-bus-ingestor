name: Wraith Bus Ingestor CI

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  test-and-verify:
    runs-on: ghost-runner
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies into system Python
        # uv itself is already on ghost-runner -- no sibling repo's test.yml
        # installs it (setup-uv downloads a tarball to /tmp and spawns it,
        # which ENOENTs here; that's not how any other Wraith repo does it).
        # The runner image just stopped baking in project deps like flask, so
        # export the locked deps and install those into system Python
        # directly. `uv pip install .[dev]` would instead try to build this
        # non-package (see pyproject.toml's `tool.uv.package = false`) into a
        # wheel and hit hatchling's "no directory matches the project name".
        run: |
          uv export --extra dev --no-hashes -o requirements.txt
          uv pip install --system -r requirements.txt
      - name: Run Tests
        run: |
          chmod +x bin/run_tests.sh
          ./bin/run_tests.sh --no-venv
        env:
          PYTHONPATH: .
      - name: Validate data contracts
        # No live QuestDB or built marts file exists on this runner, so most
        # checks here degrade to a graceful skip -- see validate.py's own
        # handling of an unreachable engine. What this step actually catches
        # is a syntax/structure error in the ODCS contracts or the ontology
        # YAML itself (yaml.safe_load runs eagerly, before any skip decision).
        # The gate that checks real data is dbt/build.sh, which runs this
        # same script against the live marts before every publish.
        run: uv run python3 contracts/validate.py

  auto-merge:
    needs: test-and-verify
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call Central Merge Action
        uses: https://git.thomaspeoples.com/thomaspeoples/ci-actions/auto-merge@main
        with:
          gitea_token: ${{ secrets.giteatoken }}
          api_url: "${{ secrets.giteaurl }}/api/v1"
