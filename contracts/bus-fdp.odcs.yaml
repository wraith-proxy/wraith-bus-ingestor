  - property: consumes
    value: bus-fdp.int_pings_segmented_to_journeys.cum_km
  properties:
  - id: mea_journey_key
    name: journey_key
    logicalType: string
    physicalType: VARCHAR
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    description: The journey this training row came from. With ping_seq, the primary key.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_line
    name: line
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Service number, one of the grain columns of the fitted model.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_direction
    name: direction
    logicalType: string
    physicalType: VARCHAR
    description: Journey direction, straight from the feed's DirectionRef -- see int_journeys_shaped_and_directed. A grain column of the fitted model; NULL forms its own grain like any other value.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_operator
    name: operator
    logicalType: string
    physicalType: VARCHAR
    description: NOC of the operating company; NULL is its own group downstream.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_day_type
    name: day_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: 'The day pattern of THIS ping, from local time -- not of the journey. It matters at the seam: a journey leaving at 23:50 on Saturday is still running at 00:10 on Sunday, and the API asking "what is the pace right now" at 00:10 is asking a Sunday question.'
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_hour_band
    name: hour_band
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The band of THIS ping, not of the journey. The API looks the model up by the band of the current clock time, so training rows have to be bucketed the same way -- a journey starting at 09:50 correctly contributes its first pings to am_peak and the rest to inter.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_ping_ts
    name: ping_ts
    logicalType: date
    physicalType: TIMESTAMP
    description: Ping instant, UTC wall clock. Not described in the intermediate yml.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_ping_seq
    name: ping_seq
    logicalType: integer
    physicalType: BIGINT
    primaryKey: true
    primaryKeyPosition: 2
    required: true
    description: Position within the journey. Always at least two short of the end -- see remaining_km.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: mea_remaining_km
    name: remaining_km
    logicalType: number
    physicalType: DOUBLE
    required: true
    description: 'Path distance from this ping to the journey''s final ping. Always strictly positive: the last two pings of every journey are dropped because they sit at remaining ~= 0, carry no information about pace, and left in they flatten r2 and drag the intercept toward zero.'
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_pings_measured_to_journey_end.sql:75 (DOUBLE arithmetic)
  - id: mea_remaining_secs
    name: remaining_secs
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: Seconds from this ping to the journey's final ping. The regression target.
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_pings_measured_to_journey_end.sql:76 (date_diff returns BIGINT)
- id: eta_obj
  name: int_eta_daily_stats
  physicalName: int_eta_daily_stats
  logicalType: object
  physicalType: table
  description: 'The ETA regression''s training set reduced to its sufficient statistics: one row per (stats_date, operator, line, direction, day_type, hour_band) -- eta_models'' finest grain plus the date -- holding the six numbers an ordinary least-squares fit of remaining_secs on remaining_km actually needs: the cell''s count, means, and centred sums of squares and products. Those add up across days and cells exactly (the pooled, or Chan, formulas in eta_models.sql), so a fit over pooled rows is the line regr_slope() would draw through the raw pings. tests/assert_eta_stats_match_raw_fit.sql checks that against the raw pings on the dates they still cover, and checks eta_models'' own pooling of this table. Why it exists (ADR-0010): one row per cell per day where the raw pings are ~13M rows a day, so it keeps history_days() of evidence after the pings themselves have aged out of the SSD. Incremental by stats_date: a run rewrites every date from two days before the newest one the table already held (the model header says why two), and the post-hook drops anything more than history_days() older than the newest. A missed night heals on the next run, as long as the raw window still holds its dates. full_refresh follows the `replay` var: a plain FULL_REFRESH=1 keeps this table, because it is the only copy of anything older than the extract window, and only an ops/incident.py replay rebuilds it, from whatever is in data/.'
  dataGranularityDescription: One row per (stats_date, operator, line, direction, day_type, hour_band); operator and direction may be NULL and form their own group.
  customProperties:
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.journey_key
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.end_ts
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.journey_key
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.operator
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.line
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.direction
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.day_type
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.hour_band
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.remaining_km
  - property: consumes
    value: bus-fdp.int_pings_measured_to_journey_end.remaining_secs
  properties:
  - id: eta_stats_date
    name: stats_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'Europe/London local date of the journey''s END, for every training ping of that journey: a journey across midnight belongs whole to the later date. The incremental key -- see the model description for which dates a run rewrites and which the post-hook drops.'
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_eta_daily_stats.sql:111 (cast .. as date)
  - id: eta_operator
    name: operator
    logicalType: string
    physicalType: VARCHAR
    description: National Operator Code, as int_pings_measured_to_journey_end has it. NULL is its own group; eta_models' null guards decide which rungs may use it.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: eta_line
    name: line
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Service number, one of the grain columns of the fitted model.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: eta_direction
    name: direction
    logicalType: string
    physicalType: VARCHAR
    description: As int_pings_measured_to_journey_end has it, straight from the feed's DirectionRef. NULL forms its own group, exactly as it did in the raw fit.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: eta_day_type
    name: day_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The day pattern of each training PING, from local time, as in int_pings_measured_to_journey_end -- not of the journey, and not of stats_date.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: eta_hour_band
    name: hour_band
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The band of each training PING, as in int_pings_measured_to_journey_end.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: eta_n_obs
    name: n_obs
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: Training pings in this cell on this date (regr_count). At least 1 by construction.
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_eta_daily_stats.sql:144 (regr_count)
  - id: eta_avg_km
    name: avg_km
    logicalType: number
    physicalType: DOUBLE
    description: Mean remaining_km of those pings (regr_avgx).
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_eta_daily_stats.sql:145 (regr_avgx)
  - id: eta_avg_secs
    name: avg_secs
    logicalType: number
    physicalType: DOUBLE
    description: Mean remaining_secs of those pings (regr_avgy).
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_eta_daily_stats.sql:146 (regr_avgy)
  - id: eta_sxx
    name: sxx
    logicalType: number
    physicalType: DOUBLE
    description: Sum of squared deviations of remaining_km from avg_km (regr_sxx). Centred, not a raw sum of squares -- see the model header for why.
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_eta_daily_stats.sql:147 (regr_sxx)
  - id: eta_sxy
    name: sxy
    logicalType: number
    physicalType: DOUBLE
    description: Sum of the products of the remaining_km and remaining_secs deviations (regr_sxy).
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_eta_daily_stats.sql:148 (regr_sxy)
  - id: eta_syy
    name: syy
    logicalType: number
    physicalType: DOUBLE
    description: Sum of squared deviations of remaining_secs from avg_secs (regr_syy).
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_eta_daily_stats.sql:149 (regr_syy)
- id: dly_obj
  name: int_journey_delays
  physicalName: int_journey_delays
  logicalType: object
  physicalType: table
  description: 'One row per journey line_punctuality aggregates: how late it finished against its scheduled arrival, filed under the local date it finished on. The three filters on which journeys count -- a scheduled arrival, a feed-tagged direction, a delay inside plus or minus two hours -- are the ones line_punctuality applied to int_journeys_shaped_and_directed before ADR-0010, now applied here. Kept for history_days() by stats_date, for the same reason as int_eta_daily_stats: the journeys it comes from are pruned along with their pings, which only go back extract_days. Incremental exactly as int_eta_daily_stats is: each run rewrites every date from two days before the newest one the table already held, older dates stay as they were last written, and the post-hook keeps history_days() of them. A plain FULL_REFRESH=1 keeps it; an ops/incident.py replay rebuilds it from data/. The model header has the rewrite arithmetic; ADR-0010 has the why.'
  dataGranularityDescription: One row per journey that has a scheduled arrival, a feed direction and a delay within +-2 hours.
  customProperties:
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.journey_key
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.line
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.direction
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.day_type
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.hour_band
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.end_ts
  - property: consumes
    value: bus-fdp.int_journeys_shaped_and_directed.dest_aimed_arr_ts
  properties:
  - id: dly_stats_date
    name: stats_date
    logicalType: date
    physicalType: DATE
    required: true
    description: 'Europe/London local date of the journey''s trimmed end -- the ping_local_date of its last moving ping. The incremental key, rewritten and pruned exactly as int_eta_daily_stats.stats_date. It decides which night a row is written on, not a grain: day_type and hour_band are still the journey''s own, from where it started.'
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_journey_delays.sql:76 (cast .. as date)
  - id: dly_journey_key
    name: journey_key
    logicalType: string
    physicalType: VARCHAR
    primaryKey: true
    primaryKeyPosition: 1
    required: true
    unique: true
    description: Primary key, as int_journeys_shaped_and_directed.journey_key. One row per journey across every retained stats_date.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: dly_line
    name: line
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: Service number.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: dly_direction
    name: direction
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: feed_direction, never NULL here -- an untagged journey is excluded, as line_punctuality has always excluded it; see line_punctuality.direction for why.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: dly_day_type
    name: day_type
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The service pattern of the local date the journey set off on, as int_journeys_shaped_and_directed has it. One value per journey.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: dly_hour_band
    name: hour_band
    logicalType: string
    physicalType: VARCHAR
    required: true
    description: The band the journey started in, from local time.
    customProperties:
    - property: typeInferredFrom
      value: passthrough
  - id: dly_delay_s
    name: delay_s
    logicalType: integer
    physicalType: BIGINT
    required: true
    description: Scheduled arrival to the journey's last moving ping, in seconds, positive late. Within plus or minus 7200 by construction; beyond that it is a mis-joined schedule, not a late bus.
    customProperties:
    - property: typeInferredFrom
      value: dbt/models/intermediate/int_journey_delays.sql:98 (date_diff returns BIGINT)
