name: ghost_bus
version: 1.0.0
config-version: 2

# Everything here runs against a local DuckDB file (ghost_bus.duckdb) that Flask
# later opens READ-ONLY, so there is no warehouse to keep warm and a full rebuild
# is cheap enough to do from scratch every time.
profile: ghost_bus

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ghost_bus:
    +materialized: view
    staging:
      # Staging is rename+cast only, so a view costs nothing and always reflects
      # whatever parquet files currently sit in data/.
      +materialized: view
      +schema: null
    intermediate:
      # Views by default, but the two models that every downstream model scans
      # (journey segmentation and the stop spatial join) are materialised as
      # tables in their own config blocks -- recomputing a 20M-row window
      # function three times is the single biggest cost in this project.
      +materialized: view
    marts:
      # Marts are read by a long-lived Flask process over a read-only DuckDB
      # handle; they must be real tables, not views over parquet.
      +materialized: table
