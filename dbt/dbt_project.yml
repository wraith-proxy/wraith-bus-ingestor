name: wraith_bus_ingestor
version: 1.0.0
config-version: 2

# Everything here runs against a local DuckDB file (wraith_bus_ingestor.duckdb) that
# Flask later opens READ-ONLY. The most expensive intermediate model
# (int_pings_segmented_to_journeys) is incremental -- see its file header --
# so the scratch warehouse persists across runs on purpose; a normal nightly
# run only reprocesses the last couple of days for it. Everything else here is
# still cheap enough to rebuild from scratch every time, and does.
profile: wraith_bus_ingestor

# Single source of truth for how much history the incremental models keep --
# see macros/retention_days.sql. Matches RETENTION_DAYS in .env (7 days live
# on the SSD + 1 day buffer): no point accumulating more dbt-side history
# than QuestDB itself still has hot.
vars:
  extract_days: 8

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  wraith_bus_ingestor:
    +materialized: view
    staging:
      # Staging is rename+cast only, so a view costs nothing and always reflects
      # whatever parquet files currently sit in data/.
      +materialized: view
      +schema: null
    intermediate:
      # Views by default, but the two models that every downstream model scans
      # (journey segmentation and the stop spatial join) are materialised as
      # incremental tables in their own config blocks -- recomputing a 20M-row
      # window function over the whole retention window every run is the
      # single biggest cost in this project.
      +materialized: view
    marts:
      # Marts are read by a long-lived Flask process over a read-only DuckDB
      # handle; they must be real tables, not views over parquet.
      +materialized: table
