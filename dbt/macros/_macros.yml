version: 2

macros:
  - name: haversine_km
    description: >
      Great-circle distance in kilometres between two lat/lon pairs, on a
      spherical earth (R = 6371 km). Emitted inline as a SQL expression rather
      than a UDF, since a UDF would need registering on every DuckDB connection
      dbt opens. Used throughout the intermediate layer for step distances and
      journey shape.
    arguments:
      - name: lat1
        description: Latitude of the first point.
      - name: lon1
        description: Longitude of the first point.
      - name: lat2
        description: Latitude of the second point.
      - name: lon2
        description: Longitude of the second point.

  - name: avg_speed_kmh
    description: >
      A journey's average speed in km/h: path distance over elapsed time.
      Repeated 3x verbatim in int_journeys_shaped_and_directed.sql before
      this macro existed (ROADMAP.md 1.18.0).
    arguments:
      - name: path_km
        description: Distance travelled, in km.
      - name: duration_secs
        description: Elapsed time, in seconds.

  - name: no_operator_sentinel
    description: >
      The pre-2026-09-12, no-operator sentinel -- coalesce(operator,
      '~none~'). operator is genuinely NULL for every ping before that date,
      and SQL joins/partitions never match NULL to NULL. Repeated verbatim in
      int_pings_segmented_to_journeys.sql before this macro existed
      (ROADMAP.md 1.18.0).
    arguments:
      - name: operator_expr
        description: The operator column or expression to key on.

  - name: in_gb_bbox
    description: >
      The GB ingest bounding box (mainland Great Britain). Repeated verbatim
      in stg_bods__vehicle_pings.sql and stg_naptan__stops.sql before this
      macro existed (ROADMAP.md 1.18.0). See ROADMAP.md, "Decided,
      2026-09-23 -- keep the ingest bounding box GB-wide" for why it stays
      this wide.
    arguments:
      - name: lat_expr
        description: The latitude column or expression to filter.
      - name: lon_expr
        description: The longitude column or expression to filter.

  - name: hour_band
    description: >
      Buckets a LOCAL (Europe/London) hour-of-day integer (0-23) into the five
      traffic-regime bands the ETA model is fitted per: night, am_peak, inter,
      pm_peak, evening. FROZEN against backend/app.py's own banding -- if the
      two disagree, a lookup silently resolves one grain coarser than it
      should. Must be called with a LOCAL hour, never a UTC one.
    arguments:
      - name: hour_expr
        description: Integer hour of day (0-23), derived from Europe/London local time.

  - name: day_type
    description: >
      Buckets a LOCAL timestamp into the service pattern the operator runs
      that day: weekday, sat or sun. Bank holidays are not detected and file
      as weekday, deliberately -- see the macro's own header for why. Must be
      called with a LOCAL timestamp, never a UTC one.
    arguments:
      - name: local_ts_expr
        description: A timestamp already converted to Europe/London local time.

  - name: locality_norm
    description: >
      The search key shared by localities, line_localities and the Flask
      /api/search endpoint: uppercase, strip everything that is not a
      letter/digit/space, collapse runs of spaces, trim. Frozen in
      CONTRACT.md s2 because the API normalises a user's search term with
      exactly this rule.
    arguments:
      - name: expr
        description: The raw locality text to normalise.

  - name: ping_columns
    description: >
      Compile-time helper, not a SQL expression: asks DuckDB what columns
      data/bus_positions_*.parquet actually has right now, so
      stg_bods__vehicle_pings can emit a typed NULL for any schedule column
      (direction, journey_ref, origin_ref, dest_aimed_arr, ...) that older
      daily files predate. Keeps the project buildable on a fresh box that
      only has historical data. Takes no arguments; reads the bods.bus_positions
      source directly.

  - name: retention_days
    description: >
      Single source of truth for how many days of raw pings dbt keeps: the
      window int_pings_segmented_to_journeys' post-hook prunes to. Reads the
      `extract_days` var in dbt_project.yml -- change it there, not in the
      models. Keep it in sync with RETENTION_DAYS in .env: no point dbt
      accumulating more raw history than QuestDB itself still has hot on the
      SSD. Since ADR-0010 it is no longer the window the ETA regression trains
      on -- see history_days. Takes no arguments.

  - name: history_days
    description: >
      How many days the two history models (int_eta_daily_stats,
      int_journey_delays) keep behind their newest date, and therefore the
      window eta_models and line_punctuality are computed over. Reads the
      `history_days` var in dbt_project.yml -- change it there, not in the
      models. Deliberately independent of retention_days: those two tables
      hold one row per cell or journey per day where the raw pings are ~13M
      rows a day, so they outlive the raw window, and QuestDB's hot window on
      the SSD, on purpose (ADR-0010). Takes no arguments.
