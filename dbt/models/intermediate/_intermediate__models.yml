version: 2

models:
  - name: int_pings_segmented_to_journeys
    description: >
      The ping stream cut into journeys. One row per ping, carrying the
      journey it belongs to and where in that journey it sits.

      Everything hard about this dataset is handled here. A vehicle reference is
      reused all day and across operators, buses keep transmitting while parked
      on a terminus stand, and the feed gives us no journey identifier for any
      historical row -- so "which pings belong to one run of the route" has to
      be reconstructed. Six break conditions do it; the model header explains
      each and names its ceiling.

      Incremental (see the model's own header for the read/write window and
      why the key is derived the way it is): three downstream models scan it,
      and recomputing the window functions over the full retained history
      every run was the single most expensive step in the project before that.
    columns:
      - name: journey_key
        description: >
          Synthetic journey identifier,
          '<operator or ~none~>|<bus_id>#<epoch_ms of its first ping>' (changed
          2026-09-20 from '<bus_id>#<epoch_ms>': bus_id is minted by each
          operator, so it is not a vehicle identity on its own).
          Deterministic for a given physical journey regardless of how wide a
          window it was read through -- see the model header for why that
          matters once this became incremental.
        tests: [not_null]
      - name: ping_seq
        description: Position of this ping within its journey, 1-based. With journey_key it is the primary key of this table.
        tests: [not_null]
      - name: hop_km
        description: >
          Great-circle distance from the previous ping. Forced to zero on the
          first ping of a journey, where the previous ping belongs to a
          different run and is often in another town.
      - name: cum_km
        description: >
          Running path length from the journey's first ping. Measured as the sum
          of straight hops between 3-minute samples, so it cuts corners and
          understates the true road distance by roughly 10-20% on winding urban
          routes. Consistent, which is what the regression needs.
      - name: first_moving_seq
        description: >
          ping_seq of the first ping at which the bus was actually moving
          (>= 50 m in a bucket). NULL if the journey never moved at all.
      - name: last_moving_seq
        description: >
          ping_seq of the last moving ping. int_journeys_shaped_and_directed
          trims the journey to [first_moving_seq, last_moving_seq]: the
          stationary tail at the terminus is real time but not travel, and
          leaving it in absorbed into a large positive regression intercept.
          Measured: trimming moved r2 from 0.52 to 0.69.
      - name: journey_n_pings
        description: Ping count of the UNtrimmed journey; kept for diagnostics, not used as a filter.
      - name: journey_start_ts
        description: First ping time of the untrimmed journey.
      - name: journey_end_ts
        description: Last ping time of the untrimmed journey.

  - name: int_journeys_shaped_and_directed
    description: >
      One row per journey: where it ran, how far, how long, and which way round
      the route. Implausible journeys are dropped here, so every downstream
      model can take this table at face value.

      Also where direction is decided. Until 2026-09-23 this also INFERRED a
      direction from journey geometry whenever the feed's own DirectionRef was
      NULL. Retired (ROADMAP.md 1.2.0): measured against the build warehouse,
      feed_direction now covers 68.1% of journeys, and where both existed the
      heuristic disagreed with it 53.9% of the time -- chance level, because
      the heuristic's inbound/outbound split was never tied to the feed's own
      convention. direction is now feed_direction, unmodified; NULL on the
      31.9% the feed didn't tag, which nothing downstream requires non-null.
    columns:
      - name: journey_key
        description: Primary key. One row per surviving journey.
        tests: [not_null, unique]
      - name: line
        description: Service number. Not a route identifier -- see stg_bods__vehicle_pings.line.
        tests: [not_null]
      - name: feed_direction
        description: The operator's DirectionRef if the feed supplied one for any ping of this journey, else NULL. Present on 68.1% of journeys as of 2026-09-23.
      - name: direction
        description: >
          feed_direction, unmodified -- see the model description. NULL where
          the feed did not tag this journey. Never '*': '*' names a fallback
          grain of the model, not a real direction of travel.
        tests:
          - accepted_values:
              arguments:
                values: ['inbound', 'outbound', 'clockwise', 'anticlockwise']
      - name: hour_band
        description: The band the journey STARTED in, from local time. A journey is short enough that using one band per journey keeps it inside one grain of the punctuality aggregate.
        tests: [not_null]
      - name: day_type
        description: The service pattern of the local date the journey set off on. One value per journey, for the same reason as hour_band.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['weekday', 'sat', 'sun']
      - name: n_pings
        description: Pings in the trimmed journey. At least 5 by construction -- fewer is not enough shape to measure anything.
      - name: start_cum_km
        description: cum_km at the trimmed start, subtracted downstream so distances are measured from where the journey actually began moving.
      - name: start_ping_seq
        description: ping_seq of the trimmed start, so downstream models can re-slice int_pings_segmented_to_journeys to the same window.
      - name: end_ping_seq
        description: ping_seq of the trimmed end.
      - name: path_km
        description: Distance travelled along the observed path between the trimmed start and end. At least 0.5 km by construction.
      - name: straight_km
        description: >
          Crow-flies distance from first to last position. Mostly a diagnostic:
          straight_km / path_km near zero means the journey returned to where it
          started, which is how the terminus-layover problem was found.
      - name: duration_secs
        description: Trimmed journey duration. Constrained to 4 minutes .. 5 hours; outside that it is a fragment or a failed segmentation.
      - name: mean_speed_kmh
        description: path_km over duration. Constrained to 1..90 km/h -- below is a parked bus with drifting GPS, above is a vehicle-ref collision the segmentation failed to split.
      - name: dest_aimed_arr_ts
        description: Scheduled arrival, when the feed gave one. The sole input to int_journey_delays, and through it line_punctuality.

  - name: int_pings_measured_to_journey_end
    description: >
      The training set for the ETA regression: for every ping of every surviving
      journey, how far and how long was left to run.

      This is the whole modelling idea in one table. remaining_km is the
      independent variable, remaining_secs the dependent one.
      int_eta_daily_stats boils it down to six numbers per cell per date, and
      eta_models pools those at eleven widths (ADR-0010) -- the same fit as
      eleven GROUP BYs over this table would give.
    columns:
      - name: journey_key
        description: The journey this training row came from. With ping_seq, the primary key.
        tests: [not_null]
      - name: ping_seq
        description: Position within the journey. Always at least two short of the end -- see remaining_km.
        tests: [not_null]
      - name: line
        description: Service number, one of the grain columns of the fitted model.
        tests: [not_null]
      - name: direction
        description: >
          Journey direction, straight from the feed's DirectionRef -- see
          int_journeys_shaped_and_directed. A grain column of the fitted
          model; NULL forms its own grain like any other value.
      - name: hour_band
        description: >
          The band of THIS ping, not of the journey. The API looks the model up
          by the band of the current clock time, so training rows have to be
          bucketed the same way -- a journey starting at 09:50 correctly
          contributes its first pings to am_peak and the rest to inter.
        tests: [not_null]
      - name: day_type
        description: >
          The day pattern of THIS ping, from local time -- not of the journey.
          It matters at the seam: a journey leaving at 23:50 on Saturday is
          still running at 00:10 on Sunday, and the API asking "what is the pace
          right now" at 00:10 is asking a Sunday question.
        tests: [not_null]
      - name: remaining_km
        description: >
          Path distance from this ping to the journey's final ping. Always
          strictly positive: the last two pings of every journey are dropped
          because they sit at remaining ~= 0, carry no information about pace,
          and left in they flatten r2 and drag the intercept toward zero.
        tests: [not_null]
      - name: remaining_secs
        description: Seconds from this ping to the journey's final ping. The regression target.
        tests: [not_null]

  - name: int_eta_daily_stats
    description: >
      The ETA regression's training set reduced to its sufficient statistics:
      one row per (stats_date, operator, line, direction, day_type, hour_band)
      -- eta_models' finest grain plus the date -- holding the six numbers an
      ordinary least-squares fit of remaining_secs on remaining_km actually
      needs: the cell's count, means, and centred sums of squares and
      products. Those add up across days and cells exactly (the pooled, or
      Chan, formulas in eta_models.sql), so a fit over pooled rows is the line
      regr_slope() would draw through the raw pings.
      tests/assert_eta_stats_match_raw_fit.sql checks that against the raw
      pings on the dates they still cover, and checks eta_models' own pooling
      of this table.

      Why it exists (ADR-0010): one row per cell per day where the raw pings
      are ~13M rows a day, so it keeps history_days() of evidence after the
      pings themselves have aged out of the SSD. Incremental by stats_date: a
      run rewrites every date from two days before the newest one the table
      already held (the model header says why two), and the post-hook drops
      anything more than history_days() older than the newest. A missed night
      heals on the next run, as long as the raw window still holds its dates.
      full_refresh follows the `replay` var: a plain FULL_REFRESH=1 keeps this
      table, because it is the only copy of anything older than the extract
      window, and only an ops/incident.py replay rebuilds it, from whatever is
      in data/.
    columns:
      - name: stats_date
        description: >
          Europe/London local date of the journey's END, for every training
          ping of that journey: a journey across midnight belongs whole to the
          later date. The incremental key -- see the model description for
          which dates a run rewrites and which the post-hook drops.
        tests: [not_null]
      - name: operator
        description: National Operator Code, as int_pings_measured_to_journey_end has it. NULL is its own group; eta_models' null guards decide which rungs may use it.
      - name: line
        description: Service number, one of the grain columns of the fitted model.
        tests: [not_null]
      - name: direction
        description: As int_pings_measured_to_journey_end has it, straight from the feed's DirectionRef. NULL forms its own group, exactly as it did in the raw fit.
      - name: day_type
        description: The day pattern of each training PING, from local time, as in int_pings_measured_to_journey_end -- not of the journey, and not of stats_date.
        tests: [not_null]
      - name: hour_band
        description: The band of each training PING, as in int_pings_measured_to_journey_end.
        tests: [not_null]
      - name: n_obs
        description: Training pings in this cell on this date (regr_count). At least 1 by construction.
        tests: [not_null]
      - name: avg_km
        description: Mean remaining_km of those pings (regr_avgx).
      - name: avg_secs
        description: Mean remaining_secs of those pings (regr_avgy).
      - name: sxx
        description: Sum of squared deviations of remaining_km from avg_km (regr_sxx). Centred, not a raw sum of squares -- see the model header for why.
      - name: sxy
        description: Sum of the products of the remaining_km and remaining_secs deviations (regr_sxy).
      - name: syy
        description: Sum of squared deviations of remaining_secs from avg_secs (regr_syy).

  - name: int_journey_delays
    description: >
      One row per journey line_punctuality aggregates: how late it finished
      against its scheduled arrival, filed under the local date it finished
      on. The three filters on which journeys count -- a scheduled arrival, a
      feed-tagged direction, a delay inside plus or minus two hours -- are the
      ones line_punctuality applied to int_journeys_shaped_and_directed before
      ADR-0010, now applied here.

      Kept for history_days() by stats_date, for the same reason as
      int_eta_daily_stats: the journeys it comes from are pruned along with
      their pings, which only go back extract_days. Incremental exactly as
      int_eta_daily_stats is: each run rewrites every date from two days
      before the newest one the table already held, older dates stay as they
      were last written, and the post-hook keeps history_days() of them. A
      plain FULL_REFRESH=1 keeps it; an ops/incident.py replay rebuilds it
      from data/. The model header has the rewrite arithmetic; ADR-0010 has
      the why.
    columns:
      - name: stats_date
        description: >
          Europe/London local date of the journey's trimmed end -- the
          ping_local_date of its last moving ping. The incremental key,
          rewritten and pruned exactly as int_eta_daily_stats.stats_date. It
          decides which night a row is written on, not a grain: day_type and
          hour_band are still the journey's own, from where it started.
        tests: [not_null]
      - name: journey_key
        description: Primary key, as int_journeys_shaped_and_directed.journey_key. One row per journey across every retained stats_date.
        tests: [not_null, unique]
      - name: line
        description: Service number.
        tests: [not_null]
      - name: direction
        description: feed_direction, never NULL here -- an untagged journey is excluded, as line_punctuality has always excluded it; see line_punctuality.direction for why.
        tests: [not_null]
      - name: day_type
        description: The service pattern of the local date the journey set off on, as int_journeys_shaped_and_directed has it. One value per journey.
        tests: [not_null]
      - name: hour_band
        description: The band the journey started in, from local time.
        tests: [not_null]
      - name: delay_s
        description: >
          Scheduled arrival to the journey's last moving ping, in seconds,
          positive late. Within plus or minus 7200 by construction; beyond
          that it is a mis-joined schedule, not a late bus.
        tests: [not_null]
