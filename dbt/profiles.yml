# Kept inside the project so the whole thing is self-contained:
#   ../.venv/bin/dbt run --profiles-dir .   (the repo root's own venv -- see dbt/README.md)
# NOTE: the external_location paths in models/staging/{bods,naptan}/_*__sources.yml
# are RELATIVE, so dbt must be invoked with dbt/ as the working directory.
wraith_bus_ingestor:
  target: dev
  outputs:
    dev:
      type: duckdb
      # dbt builds into a SCRATCH file, never into the one Flask serves.
      # DuckDB takes an exclusive lock for the whole run, so building straight
      # into wraith_bus_ingestor.duckdb made every read-only open fail for the duration
      # ("Conflicting lock is held") and blanked the live map for minutes at a
      # time. build.sh publishes the marts into wraith_bus_ingestor.duckdb with an atomic
      # rename once the tests have passed -- so the API sees either the whole
      # old file or the whole new one, and a failed build leaves the last good
      # marts in place. See build.sh.
      path: wraith_bus_ingestor_build.duckdb
      # 3, not 6. The box has 6 cores and also runs QuestDB, the ingestor and
      # the API; at 4+ threads DuckDB drove load average past 10 and the API's
      # p50 went from 1.3 s to 15.6 s, which is long enough for nginx to start
      # serving 504s. A slower rebuild is fine, a website that falls over is not.
      threads: 3
      settings:
        # Cut to 3 GB on 2026-09-12 after two host-level OOM events during
        # int_pings_segmented_to_journeys. Raised to 6 GB again on 2026-09-13
        # once a 16 GB swapfile was added: with swap as a backstop,
        # int_pings_segmented_to_journeys now completes cleanly at 3 GB (724 s,
        # no spill trouble) but the next model, line_stops, hit DuckDB's own
        # ceiling head-on --
        # "Out of Memory Error: failed to pin block of size 256.0 KiB (2.7
        # GiB/2.7 GiB used)" -- a clean DuckDB error, not a host OOM kill.
        # That model grew a 4-way operator/day_type fallback union this same
        # session, so it is legitimately heavier than when 3 GB was set.
        # Raised again to 9 GB on 2026-09-14: 6 GB still OOM'd line_stops
        # ("failed to pin block of size 256.0 KiB (5.5 GiB/5.5 GiB used)")
        # even against the SMALLER 8-day retention window, because every row
        # in that window now has `operator` populated (the field only
        # started arriving 2026-09-12) -- all 5 operator-specific fallback
        # rungs run in full now, instead of the partial coverage the 22-day
        # window used to give them.
        #
        # Dropped back to 2 GB on 2026-09-14 after fixing the actual cause:
        # line_stops' by_grain CTE unioned raw rows across all 4 operator/
        # day_type fallback grains before aggregating, forcing all 4 grains'
        # exact median() groups open concurrently.
        #
        # First fix attempt (2026-09-14) was 4 `AS MATERIALIZED` CTEs inside
        # one query, betting DuckDB's scheduler would serialize them. That bet
        # was never verified and is abandoned -- MATERIALIZED is a hint, not a
        # barrier, and DuckDB's vectorized engine is free to run all 4
        # hash-aggregate pipelines concurrently anyway.
        #
        # Actual fix (2026-09-15): first_visit_per_journey and each of the 4
        # grains promoted to their own dbt model (int_first_visit_per_journey,
        # int_line_stops_{real_real,real_star,star_real,star_star} under
        # models/intermediate/), using approx_quantile() (bounded t-digest)
        # instead of exact median() (unbounded per-group row buffer), each
        # contract-enforced against column drift. build.sh runs this 5-model
        # cluster in a separate `dbt run --threads 1` invocation, so only one
        # grain's aggregate state is ever open in memory -- a hard scheduling
        # guarantee from dbt's own single-worker thread pool, not an
        # optimizer's discretion.
        #
        # 2 GB was NOT enough even after that fix: a threads=1, OS-capped
        # (systemd-run MemoryMax) test still got SIGKILL'd building
        # int_line_stops_real_real alone -- no concurrency involved, just that
        # grain's 732K groups. A follow-up fix (2026-09-15) dropped a redundant
        # count(distinct journey_key) -> count(*) in all 4 grain models
        # (provably identical result, O(1) per group instead of a per-group
        # hash set) but a retest at the same 2.2GB OS cap still got killed --
        # so the 732K groups' t-digest+accumulator state alone genuinely needs
        # more than 2GB.
        #
        # 4 GB and 6 GB also NOT enough, but those two tests were invalid --
        # they ran through a raw duckdb.connect() that never applied this
        # setting at all, so DuckDB had no internal limit either time; only
        # the external OS cap was ever constraining anything. Retested
        # properly (2026-09-15) with memory_limit actually passed to the
        # connection at 4GB, OS cap at 5GB to give DuckDB room to react on
        # its own: still SIGKILL'd at 41% progress, well past its own
        # configured ceiling, with no DuckDB-level graceful error at any
        # point (the old median() version DID throw one -- "Out of Memory
        # Error: failed to pin block..." -- at its own limit). That's a real
        # limitation, not a config mistake: approx_quantile's per-group
        # t-digest state appears to sit outside DuckDB's spill-managed pool
        # for this aggregate shape, so memory_limit cannot bound it here.
        #
        # Set back to 4 GB as a reasonable project-wide baseline (every
        # OTHER model in this project fits comfortably well under this,
        # per this file's own history) -- NOT a claim that
        # int_line_stops_real_real fits in it. That grain needs an
        # architectural fix (batching by line, see docs/ROADMAP.md), not a
        # bigger number here; no memory_limit value reliably bounds it.
        #
        # Raised 4GB -> 6GB 2026-09-20 (TJP-20090). The 03:00 nightly failed
        # AGAIN at 3.7GiB/3.7GiB in int_pings_matched_to_stops, one day after
        # ops/verify_build.sh passed it twice at 4GB: the margin is a coin flip,
        # not a pass. The host has 31GB now (was 15) and the build unit's cgroup
        # cap is 13000M. Measured relation on this stack: process RSS runs ~4.7GB
        # ABOVE memory_limit (Run 1: 8.69GB RSS at a 4GB limit), so 6GB should
        # peak near 11GB, under the cap. Do NOT go to 8GB without raising
        # MemoryMax: ~13GB RSS would hit it. Unproven at 6GB until a real run.
        memory_limit: '6GB'
        # DO NOT set temp_directory here. dbt-duckdb replays every `settings:`
        # entry on each new connection it opens, and DuckDB refuses to change
        # the temp directory once it has spilled to the current one -- so the
        # first model big enough to spill made every subsequent model die with
        # "Cannot switch temporary directory after the current one has been
        # used". The default (a directory beside the database file) is correct.
        #
        # Pinned so that casting the feed's TIMESTAMPTZ down to a naive
        # TIMESTAMP is deterministic. DuckDB resolves that cast against the
        # session time zone, which otherwise comes from the host -- meaning the
        # same parquet file would build differently on a UTC box and a BST one.
        # Local time is obtained explicitly with AT TIME ZONE, never implicitly.
        TimeZone: 'UTC'
        preserve_insertion_order: false
