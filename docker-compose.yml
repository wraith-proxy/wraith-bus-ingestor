services:
  # PMTiles basemap for the bus map, which lives in ghost-site
  # (www/slaycoach/bus-map/). ghost-site's nginx proxies /tiles/ to this
  # container by name over ghost-net.
  tiles:
    image: ghcr.io/maplibre/martin
    container_name: ${TILES_CONTAINER}
    restart: unless-stopped
    # Caps sized off observed docker stats (2026-09-15) plus margin, not
    # swarm/deploy.resources -- compose spec honors these directly. swap set
    # equal to mem_limit so a leak OOM-kills the container instead of
    # dragging the host through the swap-thrash pattern that took the box
    # down during line_stops rebuilds (see TJP-14094 memory notes).
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "${TILES_PORT}:3000"
    volumes:
      - ${MAPS_PATH}:/data
    command: --config /data/config.yaml --listen-addresses 0.0.0.0:3000 --webui enable-for-all
    networks:
      - ghost-net

  db:
    image: questdb/questdb:latest
    container_name: ${QUESTDB_CONTAINER}
    restart: unless-stopped
    # 4g OOM-killed the real java process mid-extraction, 2026-09-15
    # (confirmed via journalctl -k, not app-level) -- extract.py's 8-day
    # SAMPLE BY 3m aggregation query is heavier than idle/steady-state
    # ingest load. See docs/ROADMAP.md 1.1.1.
    mem_limit: 8g
    memswap_limit: 8g
    ports:
      - "${QUESTDB_HTTP_PORT}:9000"
      - "${QUESTDB_PG_PORT}:8812"
    volumes:
      - ${QUESTDB_DATA_PATH}:/var/lib/questdb
    networks:
      - ghost-net

  # ghost-site's nginx proxies /api/ to this container by name over ghost-net.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ${API_CONTAINER}
    restart: unless-stopped
    # 6g, was 1.5g. The API loads every mart row into Python dicts (line_stops
    # alone is ~2.6M rows) and the whole-GB bounding box (2026-09-12) grew the
    # marts far past what 1.5g was sized for: on 2026-09-19 the first request
    # after a publish took it from 93MB to the limit in ~6s and it was
    # OOM-killed in a restart loop, leaving predictions dead. Measured: 2.46GiB
    # steady after a fresh load, 4.29GiB peak on an in-place reload (old and new
    # copies coexist), settling at 3.44GiB. See docs/operations.md.
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - QUESTDB_URL=${QUESTDB_URL}
      - OSRM_URL=${OSRM_URL}
      - MARTS_PATH=/models/wraith_bus_ingestor.duckdb
    volumes:
      # dbt marts, read-only. The whole directory is mounted rather than the
      # .duckdb file itself: bind-mounting a file that does not exist yet makes
      # Docker create a directory in its place.
      - ./dbt:/models:ro
    networks:
      - ghost-net
    depends_on:
      - osrm

  # Self-hosted road routing (car profile -- OSRM has no bus profile, and a
  # bus mostly drives the same streets a car does), used to snap /api/route
  # LineStrings to actual roads instead of straight lines between stops.
  # Graph built once from a Great-Britain OSM extract -- see osrm_data/build.sh.
  # No host port: only the api container talks to it, over ghost-net.
  osrm:
    image: osrm/osrm-backend
    container_name: ${OSRM_CONTAINER}
    restart: unless-stopped
    # Measured 2026-09-15: the 3g cap set here initially left ~0 headroom --
    # osrm-routed's actual startup RSS (anon-rss ~3.06GB per dmesg) sat right
    # at the 3GB ceiling, so it OOM'd and crash-looped on every restart
    # attempt (confirmed via `docker inspect --format '{{.State.OOMKilled}}'`
    # and `journalctl -k`, both pointing at this container's own memcg, not
    # host-wide pressure). Raised to 5g for real margin above the measured need.
    mem_limit: 5g
    memswap_limit: 5g
    command: osrm-routed --algorithm mld /data/great-britain-latest.osrm
    volumes:
      - ${OSRM_DATA_PATH}:/data:ro
    networks:
      - ghost-net

  # Moves bus_positions partitions older than RETENTION_DAYS off this box and
  # onto the separate drive at ARCHIVE_PATH, instead of deleting them --
  # QuestDB's own SET TTL was considered and rejected for this table
  # specifically because TTL drops data outright. Runs as root: the
  # partition directories on disk are owned by QuestDB's in-container uid,
  # which the host user cannot write to.
  archiver:
    build:
      context: .
      dockerfile: archiver/Dockerfile
    container_name: ${ARCHIVER_CONTAINER}
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - QUESTDB_URL=${QUESTDB_URL}
      - RETENTION_DAYS=${RETENTION_DAYS}
    # No QuestDB data mount any more: days are exported over QuestDB's own HTTP
    # API to Parquet and dropped via SQL, so this container never touches its
    # partition files (docs/adr/0007).
    volumes:
      - ${ARCHIVE_PATH}:/archive
    networks:
      - ghost-net
    depends_on:
      - db

  ingestor:
    build:
      context: .
      dockerfile: ingestor/Dockerfile
    container_name: ${INGESTOR_CONTAINER}
    dns:
      - 194.242.2.2
      - 1.1.1.1
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      - BODS_API_KEY=${BODS_API_KEY}
      - QUESTDB_URL=${QUESTDB_URL}
    networks:
      - ghost-net
    depends_on:
      - db

  # Reads QuestDB over the Postgres wire protocol on 8812 (already published by
  # the db service), so a dashboard panel is a direct query against the live
  # table rather than a second pipeline to build and keep in sync. Anonymous
  # Viewer is deliberate: nginx exposes this publicly read-only, so the admin
  # password gates only edit/admin, not reading. No host port -- only nginx
  # talks to it, over ghost-net, same as api and osrm.
  # ${GRAFANA_DATA_PATH} is written by Grafana's own in-container uid 472, so it
  # has to be chowned once before first boot or Grafana exits on a permission
  # error -- the same class of gotcha as QuestDB's uid 10001 next door.
  grafana:
    # Pinned, unlike questdb/osrm-backend elsewhere in this file: `:latest`
    # silently pulled in Grafana 13's "Dynamic dashboards", GA'd and on by
    # default 2026-04-08 (grafana/grafana#122663) -- a hand-provisioned
    # classic-schema (v1) dashboard renders (layout, titles, panels all
    # correct) but the frontend never issues the query request at all.
    #
    # Confirmed live, the hard way, across three attempts: 13.x (zero real
    # /api/ds/query calls from an actual device), then 12.3.11 with the
    # kubernetesDashboards/dashboardScene* toggles set false explicitly
    # (still zero -- Grafana reported the toggles back as true regardless,
    # meaning this line's toggle is locked GA and not configurable, not
    # just defaulted-on). 11.6.16 predates the whole apiserver-backed
    # dashboard path -- it does not exist as a toggle to fight in this
    # version at all -- and that's what actually fixed it.
    image: grafana/grafana:11.6.16
    container_name: ${GRAFANA_CONTAINER}
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - NTFY_TOPIC=${NTFY_TOPIC}
    volumes:
      - ${GRAFANA_DATA_PATH}:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - ghost-net
    depends_on:
      - db

  # Alert delivery. Grafana Alerting's webhook contact point posts here
  # server-side over ghost-net, so no host port and no browser involvement.
  # The topic name is the only thing gating who can subscribe to these alerts,
  # which makes it a credential: it is generated random and treated as a
  # secret, never committed.
  ntfy:
    image: binwiederhier/ntfy
    container_name: ${NTFY_CONTAINER}
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    command: serve
    networks:
      - ghost-net

networks:
  # Owned by ghost-site's own compose file (name: ghost-net, driver: bridge).
  # ghost-site must be brought up first on a cold boot so this network
  # already exists -- compose can't express depends_on across projects.
  ghost-net:
    external: true
