site_name: wraith-bus-ingestor
site_description: Live UK bus tracking data platform -- BODS ingest, QuestDB, dbt/DuckDB ETA model, Flask API
site_author: Thomas Peoples
repo_url: https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor
edit_uri: edit/main/docs/
site_url: https://www.thomaspeoples.com/gitea-repos/wraith-bus-ingestor/
use_directory_urls: true

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Bus Platform: bus-platform.md
  - Contracts: contracts.md
  - Operations: operations.md
  - Roadmap: ROADMAP.md
  - Architecture Decisions:
      - "0001 - line_stops memory & batching": adr/0001-line-stops-memory-and-batching.md
      - "0002 - line_stops final assembly": adr/0002-line-stops-final-assembly.md
      - "0003 - replay verified by construction": adr/0003-replay-verified-by-construction.md
      - "0004 - api container has no deploy automation": adr/0004-api-container-has-no-deploy-automation.md
  - Python API: api.md
  - dbt Docs: dbt/index.html
  - Learn dbt:
      - Start here: learn-dbt/index.md
      - The Rules: learn-dbt/the-rules.md
      - "1. Take off": learn-dbt/1-take-off.md
      - "2. A model is a SELECT": learn-dbt/2-a-model-is-a-select.md
      - "3. ref() and the graph": learn-dbt/3-ref-and-the-graph.md
      - "4. Tests": learn-dbt/4-tests.md
      - "5. view, table, incremental": learn-dbt/5-materializations.md
      - "6. Jinja and macros": learn-dbt/6-jinja-and-macros.md
      - "7. The map of everything": learn-dbt/7-docs-and-lineage.md
      - Landing: learn-dbt/landing.md
      - Cheat sheet: learn-dbt/cheatsheet.md

plugins:
  - search

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details

extra:
  links:
    - icon: material/home
      link: https://www.thomaspeoples.com/
      name: Back to Main Site
