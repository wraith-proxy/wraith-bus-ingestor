site_name: wraith-bus-ingestor
site_description: Live UK bus tracking data platform -- BODS ingest, QuestDB, dbt/DuckDB ETA model, Flask API
site_author: Thomas Peoples
repo_url: https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor
repo_name: thomaspeoples/wraith-bus-ingestor
edit_uri: edit/main/docs/
site_url: https://www.thomaspeoples.com/gitea-repos/wraith-bus-ingestor/
use_directory_urls: true

copyright: Part of the Ghost Stack. Sovereign. Self-hosted. No nonsense.

theme:
  name: material
  language: en
  # Sovereign: no Google Fonts. System font stacks are set in docs/stylesheets/extra.css.
  font: false
  logo: assets/ghost.svg
  favicon: assets/favicon.svg
  icon:
    repo: simple/gitea
  palette:
    # Colours for both schemes live in docs/stylesheets/extra.css (primary/accent: custom).
    # Dark is listed first with no media query, so every first-time visitor gets
    # dark whatever their system setting. The toggle switches and is remembered.
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    # Wayfinding
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.tracking
    # Speed: single-page navigation, prefetch on hover, progress bar on slow links.
    # Any script added later must subscribe to Material's document$ observable.
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.tooltips

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Bus Platform: bus-platform.md
  - Contracts: contracts.md
  - Glossary: GLOSSARY.md
  - Operations: operations.md
  - Cutover runbook: runbook-cutover.md
  - Roadmap: ROADMAP.md
  - Architecture Decisions:
      - "0001 - line_stops memory & batching": adr/0001-line-stops-memory-and-batching.md
      - "0002 - line_stops final assembly": adr/0002-line-stops-final-assembly.md
      - "0003 - replay verified by construction": adr/0003-replay-verified-by-construction.md
      - "0004 - api container has no deploy automation": adr/0004-api-container-has-no-deploy-automation.md
      - "0005 - dbt v2 duckdb alpha migration (reverted)": adr/0005-dbt-v2-duckdb-alpha-migration.md
      - "0006 - bus_positions schema optimisation": adr/0006-bus-positions-schema-optimisation.md
      - "0007 - parquet archive": adr/0007-parquet-archive.md
      - "0008 - published timetables vs inferred routes": adr/0008-published-timetables-vs-inferred-routes.md
      - "0009 - fast nightly build": adr/0009-fast-nightly-build.md
      - "0010 - eta from daily statistics & 3-day hot window": adr/0010-eta-from-daily-statistics-and-3-day-hot-window.md
      - "0011 - contract-first dbt": adr/0011-contract-first-dbt.md
      - "Spikes": adr/spikes.md
  - Python API:
      - Overview: api/index.md
      - Backend: api/backend.md
      - Ops: api/ops.md
      - Contracts: api/contracts.md
      - GTFS: api/gtfs.md
      - Archiver: api/archiver.md
      - Ingestor: api/ingestor.md
      - dbt scripts: api/dbt.md
      - Tooling: api/tooling.md
  - dbt Docs: dbt/index.html
  - Learn dbt:
      - Start here: learn-dbt/index.md
      - The Rules: learn-dbt/the-rules.md
      - "1. Take off": learn-dbt/1-take-off.md
      - "2. A model is a SELECT": learn-dbt/2-a-model-is-a-select.md
      - "3. ref() and the graph": learn-dbt/3-ref-and-the-graph.md
      - "4. Tests": learn-dbt/4-tests.md
      - "5. view, table, incremental": learn-dbt/5-materializations.md
      - "6. Jinja and macros": learn-dbt/6-jinja-and-macros.md
      - "7. The map of everything": learn-dbt/7-docs-and-lineage.md
      - Landing: learn-dbt/landing.md
      - Cheat sheet: learn-dbt/cheatsheet.md

# Snippet-only file: appended to every page by pymdownx.snippets, never a page.
# /agents/ is a local, untracked folder: never published.
exclude_docs: |
  /assets/abbreviations.md
  /agents/

# Broken links and anchors surface as WARNING lines in the build.
validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search:
      lang: en
      # Also split on underscores, dots and camelCase, so bus_positions,
      # servers.type and physicalType are findable by any part. The apostrophe
      # splits too, so possessives in docstrings ("bus_positions' columns") do not
      # glue a quote onto the name.
      separator: '[\s\-_,:!=\[\]()"`/'']+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  # Bundled with mkdocs-material. At BUILD time it downloads every third-party
  # asset into assets/external/ and rewrites the references, so the published
  # site makes no third-party request. Needs network on a cold cache only when
  # there is something external to fetch (.cache/, gitignored).
  - privacy:
      assets_fetch_dir: assets/external
      # Material's bundle names a CDN copy of Mermaid, used only when `mermaid`
      # is undefined. It is defined (vendored), so skip the 3.5 MB download and
      # the build's need for network. Anything else external is still fetched.
      assets_exclude:
        - unpkg.com/mermaid@*

# Defines `mermaid` before Material's bundle runs, so Material never fetches
# its own copy from unpkg. See docs/javascripts/vendor/SOURCE.txt.
extra_javascript:
  - javascripts/vendor/mermaid.min.js

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
      # Glossary terms and acronyms get a hover definition on every page.
      auto_append:
        - docs/assets/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - admonition
  - abbr
  - toc:
      permalink: "#"
      permalink_title: Link to this section

extra:
  social:
    - icon: material/home
      link: https://www.thomaspeoples.com/
      name: Back to Main Site
    - icon: simple/gitea
      link: https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor
      name: Source on Gitea
    - icon: material/bug-outline
      link: https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor/issues
      name: Issues
