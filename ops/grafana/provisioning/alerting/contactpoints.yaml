# The topic name is the credential -- anyone who knows it can read and publish
# to it -- so it comes from the NTFY_TOPIC env var passed into the grafana
# container, never hardcoded here.
#
# Env-var interpolation DOES resolve here, confirmed by running it on Grafana
# 13.2.2 rather than trusting the docs, which only spell it out for datasources:
# the provisioned contact point read back from the API carries the real topic
# from .env, not the literal $NTFY_TOPIC.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-webhook
        type: webhook
        # Grafana's webhook body is a large JSON document, which ntfy would show
        # verbatim on the phone -- and with no title of its own the ntfy app shows
        # the TOPIC NAME as the title, which is the credential. So `tpl=yes` makes
        # ntfy treat the body as JSON and render `t` (title) and `m` (message) as
        # Go templates over it. Decoded:
        #   t: {{(index .alerts 0).labels.alertname}}
        #   m: {{range .alerts}}{{if eq .status "resolved"}}RESOLVED{{else}}ALERT: {{or .annotations.summary .labels.alertname}}{{end}}
        #      {{end}}
        # i.e. the title is the rule's name, and the body is `ALERT: <summary>`
        # while firing or `RESOLVED` once it clears. Rules are grouped by
        # alertname (see the policy below), so the first alert's name is the
        # group's name. Nothing else is sent.
        settings:
          url: http://ntfy:80/$NTFY_TOPIC?tpl=yes&t=%7B%7B%28index%20.alerts%200%29.labels.alertname%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DRESOLVED%7B%7Belse%7D%7DALERT%3A%20%7B%7Bor%20.annotations.summary%20.labels.alertname%7D%7D%7B%7Bend%7D%7D%0A%7B%7Bend%7D%7D
          httpMethod: POST

policies:
  - orgId: 1
    receiver: ntfy
    group_by:
      - alertname
