# The topic name is the credential -- anyone who knows it can read and publish
# to it -- so it comes from the NTFY_TOPIC env var passed into the grafana
# container, never hardcoded here.
#
# Env-var interpolation DOES resolve here, confirmed by running it on Grafana
# 13.2.2 rather than trusting the docs, which only spell it out for datasources:
# the provisioned contact point read back from the API carries the real topic
# from .env, not the literal $NTFY_TOPIC.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: ntfy-webhook
        type: webhook
        # Grafana's webhook body is a large JSON document, which ntfy would show
        # verbatim on the phone. `tpl=yes` makes ntfy treat the body as JSON and
        # render `m` as a Go template over it: one line per alert, "ALERT: " plus
        # the rule's `summary` annotation (or its name if it has none), nothing
        # else. Decoded, the template is:
        #   {{range .alerts}}ALERT: {{or .annotations.summary .labels.alertname}}
        #   {{end}}
        # Resolved messages are switched off: they are not alerts, and the format
        # above would render them as "ALERT: ..." too.
        disableResolveMessage: true
        settings:
          url: http://ntfy:80/$NTFY_TOPIC?tpl=yes&m=%7B%7Brange%20.alerts%7D%7DALERT%3A%20%7B%7Bor%20.annotations.summary%20.labels.alertname%7D%7D%0A%7B%7Bend%7D%7D
          httpMethod: POST

policies:
  - orgId: 1
    receiver: ntfy
    group_by:
      - alertname
