# Validated on Grafana 13.2.2: all three rules provision, schedule and evaluate
# to health=ok against live QuestDB. dbt_build_runs is created by the first
# dbt/publish_run_results.py run, so these rules sit in health=error until a
# build has happened -- that is the expected cold-start state, not a fault.
#
# Each rule computes its own threshold in SQL and hands a single number to a
# __expr__ condition, because the time window belongs in the query where it is
# readable rather than split between relativeTimeRange and the evaluator.
apiVersion: 1

groups:
  - orgId: 1
    name: wraith
    folder: Wraith
    interval: 5m
    rules:
      - uid: wraith-feed-stale
        title: feed stale
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                select count() from bus_positions
                where timestamp > dateadd('m', -15, now())
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              # lt 1 rather than eq 0 -- Grafana's threshold evaluator has no
              # equality operator.
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        # NoData means the query itself could not run, which is its own outage,
        # so it alerts rather than sitting silent.
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No bus positions written in the last 15 minutes.
          description: >-
            The ingest pipeline is dead or BODS is down. Nothing has landed in
            bus_positions for 15 minutes, which never happens during normal
            service hours.

      - uid: wraith-nightly-build
        title: nightly build missing or failed
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 93600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # 26h not 24h -- gives the nightly job slack to drift or run long
              # without flapping. count() = 0 catches "never ran", last(result)
              # catches "ran and failed"; last() follows the designated
              # timestamp, so it is the most recent run.
              rawSql: >-
                select case when count() = 0 or last(result) != 'success'
                then 1 else 0 end from dbt_build_runs
                where timestamp > dateadd('h', -26, now())
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: The nightly dbt build failed, or has not succeeded in 26 hours.
          description: >-
            Either the nightly dbt job did not run or its most recent run did
            not succeed. A failed run now records itself the moment it ends
            (ops/record_build_failure.sh, an ExecStopPost hook), so this fires
            within ~10 minutes of a failure rather than 26 hours later. After the September repo split the nightly job pointed
            at a deleted directory and failed silently for weeks -- nobody
            noticed because a build that never runs produces no output to read.
            That is exactly the class of failure this rule catches.

      - uid: wraith-dbt-test-failures
        title: dbt test failures or warnings
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 93600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # warned, not just failed. A failing test exits build.sh non-zero
              # and blocks the publish, so it is already loud. A warn -- source
              # freshness, or any test at severity: warn -- leaves the build
              # green and reaches nothing but build.log, which is the actual
              # gap this rule exists to close.
              rawSql: >-
                select last(tests_failed) + last(tests_warned) from dbt_build_runs
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The most recent dbt build had failing or warning tests.
          description: >-
            Closes the gap where dbt's freshness warn and severity:warn results
            only ever reached build.log -- a warn exits the build green, so
            nothing surfaced it and nobody opened the log to find out.

      # The archiver (archiver/archive.py) writes one row to archiver_runs per
      # run; Grafana can see QuestDB but not the archive drive, so that table is
      # what these two rules read. archiver_runs is created by the archiver's
      # first run, so on a fresh stack these sit in health=error until it has
      # run once -- the same cold-start state as the dbt rules above.
      - uid: wraith-archiver-not-running
        title: archiver has not run cleanly
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 129600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # 36h for a job that runs every 24h: one missed or slow run does
              # not page, two do. This is the alert that would have caught the
              # 2026-09-16..19 jam, when the archiver "ran" every day but
              # archived nothing and nobody was told.
              rawSql: >-
                select count() from archiver_runs
                where ts > dateadd('h', -36, now()) and status = 'ok'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: No clean archiver run in the last 36 hours.
          description: >-
            Either the archiver container is down or every run since has failed
            or needed attention. Until it runs, old days stay on the SSD and it
            fills. See `docker logs ghost-archiver` and archive.log on the
            archive drive, and docs/operations.md ("Archiving").

      - uid: wraith-archiver-attention
        title: archiver needs attention
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 129600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # last() follows the designated timestamp, so this is the most
              # recent run. 'attention' = a day was left in place for a human
              # (already archived but its file disagrees with the live rows);
              # 'error' = the run itself failed. It clears when a later run is
              # clean: `docker restart ghost-archiver` runs one immediately.
              rawSql: >-
                select case when last(status) != 'ok' then 1 else 0 end
                from archiver_runs
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The most recent archiver run failed or left a day for you.
          description: >-
            A day was left on the SSD on purpose (its Parquet file and the live
            rows disagree, or an export failed verification) or the run errored.
            Nothing has been dropped that was not proven. Read archive.log on
            the archive drive for the day and the reason.
