# Validated on Grafana 13.2.2: all three rules provision, schedule and evaluate
# to health=ok against live QuestDB. dbt_build_runs is created by the first
# dbt/publish_run_results.py run, so these rules sit in health=error until a
# build has happened -- that is the expected cold-start state, not a fault.
# The same is true of marts_state, created by ops/publish_marts_state.py's
# first run.
#
# Each rule computes its own threshold in SQL and hands a single number to a
# __expr__ condition, because the time window belongs in the query where it is
# readable rather than split between relativeTimeRange and the evaluator.
apiVersion: 1

groups:
  - orgId: 1
    name: wraith
    folder: Wraith
    interval: 5m
    rules:
      - uid: wraith-feed-stale
        title: feed stale
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 900
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              rawSql: >-
                select count() from bus_positions
                where timestamp > dateadd('m', -15, now())
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              # lt 1 rather than eq 0 -- Grafana's threshold evaluator has no
              # equality operator.
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        # NoData means the query itself could not run, which is its own outage,
        # so it alerts rather than sitting silent.
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: No bus positions written in the last 15 minutes.
          description: >-
            The ingest pipeline is dead or BODS is down. Nothing has landed in
            bus_positions for 15 minutes, which never happens during normal
            service hours.

      - uid: wraith-extract-waiting
        title: waiting on the extract
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 93600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # Waiting = no successful build row in the last 25.5 hours, i.e.
              # the ready marker never arrived or the build it starts has not
              # finished. The window is measured from the last success, not
              # from 03:00, so the alert fires 25.5h after that build row
              # (about 04:30 only when the last build finished near 03:00; a
              # later finish pushes it later). The marker is consumed when
              # the build starts, so the observable outcome is the build row.
              # Bounded: after 25.5h it is a failure for the owner to read,
              # not an open-ended wait.
              rawSql: >-
                select case when count() = 0 then 1 else 0 end
                from dbt_build_runs
                where result = 'success'
                and timestamp > dateadd('m', -1530, now())
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: waiting
        annotations:
          summary: Waiting on the extract - no successful build in the last 25.5 hours.
          description: >-
            Does not page: the API keeps serving the previous marts. The extract
            (wraith-bus-extract.service) writes the ready marker only for a valid
            extract, and the marker starts the build. Read dbt/extract.log.

      - uid: wraith-nightly-build
        title: nightly build failed
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 93600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # last(result) catches "ran and failed"; last() follows the
              # designated timestamp. A build that never ran is the
              # 'waiting on the extract' rule above, not this one.
              rawSql: >-
                select case when count() > 0 and last(result) != 'success'
                then 1 else 0 end from dbt_build_runs
                where timestamp > dateadd('h', -26, now())
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The nightly dbt build failed; the previous marts are still serving.
          description: >-
            The most recent build did not succeed (ops/record_build_failure.sh
            records it the moment it ends). Not a page: the API still serves the
            previous good marts. Only wraith-marts-state pages, when the API
            cannot serve.

      - uid: wraith-dbt-test-failures
        title: dbt test failures or warnings
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 93600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # warned, not just failed. A failing test exits build.sh non-zero
              # and blocks the publish, so it is already loud. A warn -- source
              # freshness, or any test at severity: warn -- leaves the build
              # green and reaches nothing but build.log, which is the actual
              # gap this rule exists to close.
              rawSql: >-
                select last(tests_failed) + last(tests_warned) from dbt_build_runs
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The most recent dbt build had failing or warning tests.
          description: >-
            Closes the gap where dbt's freshness warn and severity:warn results
            only ever reached build.log -- a warn exits the build green, so
            nothing surfaced it and nobody opened the log to find out.

      # The archiver (archiver/archive.py) writes one row to archiver_runs per
      # run; Grafana can see QuestDB but not the archive drive, so that table is
      # what these two rules read. archiver_runs is created by the archiver's
      # first run, so on a fresh stack these sit in health=error until it has
      # run once -- the same cold-start state as the dbt rules above.
      - uid: wraith-archiver-not-running
        title: archiver has not run cleanly
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 129600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # 36h for a job that runs every 24h: one missed or slow run does
              # not page, two do. This is the alert that would have caught the
              # 2026-09-16..19 jam, when the archiver "ran" every day but
              # archived nothing and nobody was told.
              rawSql: >-
                select count() from archiver_runs
                where ts > dateadd('h', -36, now()) and status = 'ok'
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: No clean archiver run in the last 36 hours.
          description: >-
            Either the archiver container is down or every run since has failed
            or needed attention. Until it runs, old days stay on the SSD and it
            fills. See `docker logs ghost-archiver` and archive.log on the
            archive drive, and docs/operations.md ("Archiving").

      - uid: wraith-archiver-attention
        title: archiver needs attention
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 129600
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # last() follows the designated timestamp, so this is the most
              # recent run. 'attention' = a day was left in place for a human
              # (already archived but its file disagrees with the live rows);
              # 'error' = the run itself failed. It clears when a later run is
              # clean: `docker restart ghost-archiver` runs one immediately.
              rawSql: >-
                select case when last(status) != 'ok' then 1 else 0 end
                from archiver_runs
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: NoData
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: The most recent archiver run failed or left a day for you.
          description: >-
            A day was left on the SSD on purpose (its Parquet file and the live
            rows disagree, or an export failed verification) or the run errored.
            Nothing has been dropped that was not proven. Read archive.log on
            the archive drive for the day and the reason.

      - uid: wraith-marts-state
        title: marts state not ok
        condition: B
        data:
          - refId: A
            datasourceUid: questdb
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: A
              format: table
              rawQuery: true
              # 30 minutes -- six publish cycles at the publisher's 5-minute
              # interval, so one or two missed/slow publishes don't page.
              # last() follows the designated timestamp, so this is the most
              # recent reading.
              rawSql: >-
                select case when last(state) != 'ok' then 1 else 0 end
                from marts_state
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        # Unlike the archiver rules above, NoData here means marts_state has
        # had nothing published in 30 minutes, which means the publisher
        # itself is down or the API is fully unreachable -- that must page
        # rather than sit silent, the same reasoning as wraith-feed-stale and
        # wraith-nightly-build.
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "The API's marts_state is not ok, or nothing has published in 30 minutes."
          description: >-
            marts_state comes from GET /api/model-info ('ok', 'locked',
            'missing', 'unreadable' or 'no_driver' -- or 'unreachable' if the
            publisher itself couldn't reach the API), published to QuestDB
            every 5 minutes by ops/publish_marts_state.py
            (ops/systemd/wraith-marts-state.timer). Closes ROADMAP.md 1.16.0:
            on 2026-09-19 the served marts were unreadable for about 26 hours
            with nothing alerting on it, because the marts had been written by
            the abandoned dbt v2 alpha (DuckDB storage version 999) and the
            API reported `unreadable` the whole time (see docs/ROADMAP.md
            "Known issues", the ADR-0005 aftermath paragraph).
