[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wraith-bus-ingestor"
version = "0.1.0"
description = "Live UK bus tracking data platform: BODS SIRI-VM ingest, QuestDB, a dbt/DuckDB ETA model, and the Flask API that serves it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Peoples", email = "hello@thomaspeoples.com" },
]
requires-python = ">=3.12"
dependencies = [
    "flask",
    "flask-cors",
    "duckdb",
    # zoneinfo (Europe/London, used for hour_band/day_type) ships without data
    # on slim/minimal Python images; tzdata backfills it.
    "tzdata",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
# Its own group, not a base dependency: dbt-core pulls in
# dbt-core-experimental-parser, a Rust wheel with no musllinux build --
# uninstallable on ghost-runner's Alpine/musl. backend/'s Flask API never
# imports dbt at all, so CI's test job (uv sync --extra dev) never needs
# this group; only dbt/build.sh does, run against `uv sync --all-extras`.
dbt = [
    "dbt-core==1.12.4",
    "dbt-duckdb==1.11.0",
]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "detect-secrets",
    "mkdocs",
    "mkdocs-material",
    "poethepoet",
    "typer",
    "genbadge[coverage]",
    "pydoc-markdown",
]

[project.urls]
Homepage = "https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor"
Repository = "https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor.git"

# App, not a library -- backend/, dbt/, contracts/, ingestor/, archiver/ are
# sibling app dirs, not one src/ tree. uv only needs this file for locking
# and `uv run`, so skip building it.
[tool.uv]
package = false

[tool.poe.tasks]
test = "pytest"
test-ci = "pytest --cov=backend --cov-report=term-missing --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
tidy = ["lint", "format"]
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"
# dbt runs under this same project-root venv now (see dbt/build.sh) -- build.sh
# just wraps the existing entry point.
build = { shell = "cd dbt && ./build.sh" }
validate = "python contracts/validate.py"

[tool.ruff]
# 99, not a default 79: this codebase's established voice is long explanatory
# prose comments, measured against the real code as fitting p99 = 99 chars.
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--cov=backend",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
]
pythonpath = ["backend"]
testpaths = ["backend"]
