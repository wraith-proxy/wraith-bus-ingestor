[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wraith-bus-ingestor"
version = "1.16.0"
description = "Live UK bus tracking data platform: BODS SIRI-VM ingest, QuestDB, a dbt/DuckDB ETA model, and the Flask API that serves it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Peoples", email = "hello@thomaspeoples.com" },
]
requires-python = ">=3.11"
dependencies = [
    "flask",
    "flask-cors",
    # zoneinfo (Europe/London, used for hour_band/day_type) ships without data
    # on slim/minimal Python images; tzdata backfills it.
    "tzdata",
    "requests",
    "pyyaml",
    # OpenAPI/Swagger, generated from the route decorators themselves (2026-09-24)
    # so it can't drift from the real routes the way a hand-maintained spec would.
    # Pulls in apispec + marshmallow.
    "flask-smorest",
]

[project.optional-dependencies]
# Real manylinux wheel now that ghost-runner is Debian/glibc, not Alpine/musl
# (see ci-images) -- that part of the 2026-09-17 migration stands. Unpinned,
# tracks latest stable.
#
# Was pinned to the 2.0 alpha alongside a dbt v2 migration, 2026-09-17 to
# 2026-09-18 -- rolled back same day. Real cause: production peak RSS hit
# 11.7GB+ on a workload that ran clean under 9GB on dbt-core 1.12.4 +
# dbt-duckdb 1.11.0, confirmed via the kernel oom-killer log itself
# (anon-rss=11.68GB at kill, not page cache -- a real process memory
# blowup). DuckDB's own team calls alpha clients "explicitly not
# production-ready"; this is the concrete cost of that. See docs/adr/0005.
#
# `<2.0`, not left unpinned: dbt-duckdb 1.11.0 has no upper bound on its own
# `duckdb` dependency, so an unpinned constraint here resolves right back to
# the 2.0 alpha (confirmed -- it's the highest version on PyPI regardless).
duckdb = [
    "duckdb<2.0",
]
# Reverted to the last known-stable pair 2026-09-18 (see docs/adr/0005).
# dbt v2 + DuckDB 2.0 alpha ran clean in isolated verification (884/884
# tests) but hit a real, unresolved memory blowup under actual production
# load in the line_stops phase -- peaked past 12GB (MemoryMax raised as a
# measurement pass) with anon-rss confirmed via kernel oom-killer log, not
# page cache. Root cause not isolated: either DuckDB 2.0 alpha not honoring
# its own memory_limit, or large overhead outside its buffer manager under
# the new Fusion engine. Revisit once DuckDB 2.0 GAs and has production
# mileage elsewhere. The Debian base switch on ghost-runner (see ci-images)
# stands regardless -- it fixed a real dead-entrypoint bug and the musl
# wheel gap applies to dbt-core v1.x too, not just v2.
dbt = [
    "dbt-core==1.12.4",
    "dbt-duckdb==1.11.0",
]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "detect-secrets",
    "mkdocs",
    "mkdocs-material",
    "poethepoet",
    "typer",
    "genbadge[coverage]",
    "pydoc-markdown",
]

[project.urls]
Homepage = "https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor"
Repository = "https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor.git"

# App, not a library -- backend/, dbt/, contracts/, ingestor/, archiver/ are
# sibling app dirs, not one src/ tree. uv only needs this file for locking
# and `uv run`, so skip building it.
[tool.uv]
package = false

# 2026-09-24: poe's default "auto" executor detects uv.lock and shells out
# to `uv run` regardless of how poe itself was invoked -- confirmed by
# running `poe docs-api` directly on ghost-runner's baked, no-.venv image
# and watching it silently download a whole new CPython + venv rather than
# use the interpreter already on PATH. "simple" runs every task with
# whatever's already active (baked --system on CI, the dev's own venv or
# shell locally if one is active) and never invokes uv on its own.
[tool.poe.executor]
type = "simple"

[tool.poe.tasks]
test = "pytest"
test-ci = "pytest --cov=backend --cov-report=term-missing --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
tidy = ["lint", "format"]
# Regenerates docs/api.md from backend/app.py's own docstrings.
docs-api = { shell = "printf '# Python API\\n\\n' > docs/api.md && pydoc-markdown pydoc-markdown.yml >> docs/api.md" }
# dbt docs generate needs the `dbt` extra and a duckdb file to introspect --
# an empty one is fine, it just means catalog data is sparse until a real
# build has run. --static inlines manifest+catalog into one HTML file, since
# this gets served under /dbt/ (a subpath), not domain root, and the default
# multi-file output's internal fetches assume the latter.
docs-dbt = { shell = "cd dbt && ../.venv/bin/python3 ensure_ci_fixtures.py && ../.venv/bin/dbt docs generate --profiles-dir . --static && mkdir -p ../docs/dbt && cp target/static_index.html ../docs/dbt/index.html" }
docs-mkdocs = "mkdocs build"
docs-build = ["docs-api", "docs-dbt", "docs-mkdocs"]
docs-serve = "mkdocs serve"
# dbt runs under this same project-root venv now (see dbt/build.sh) -- build.sh
# just wraps the existing entry point.
build = { shell = "cd dbt && ./build.sh" }
validate = "python contracts/validate.py"

[tool.ruff]
# 99, not a default 79: this codebase's established voice is long explanatory
# prose comments, measured against the real code as fitting p99 = 99 chars.
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# This generator emits dbt YAML from triple-quoted templates. Two `description:`
# lines exceed 99 chars, but they are the emitted payload, not source: a `# noqa`
# would be written into the generated file, and wrapping them would desync the
# generator from the committed _generated_line_stops_batches.yml it produces.
"dbt/scripts/generate_line_stops_batches.py" = ["E501"]

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--cov=backend",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
]
pythonpath = ["backend", "archiver", "ops"]
testpaths = ["backend", "archiver", "ops"]
