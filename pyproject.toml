[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wraith-bus-ingestor"
version = "1.5.0"
description = "Live UK bus tracking data platform: BODS SIRI-VM ingest, QuestDB, a dbt/DuckDB ETA model, and the Flask API that serves it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Thomas Peoples", email = "hello@thomaspeoples.com" },
]
requires-python = ">=3.12"
dependencies = [
    "flask",
    "flask-cors",
    # zoneinfo (Europe/London, used for hour_band/day_type) ships without data
    # on slim/minimal Python images; tzdata backfills it.
    "tzdata",
    "requests",
    "pyyaml",
]

[project.optional-dependencies]
# Real manylinux wheel now that ghost-runner is Debian/glibc, not Alpine/musl
# (see ci-images). backend/app.py already treats a missing duckdb driver as a
# degraded-but-running state (marts_state stays "unknown"), and the test
# suite skips its duckdb-dependent assertions the same way, so CI's test job
# (uv sync --extra dev) is fine without this either way.
#
# Pinned to the 2.0 alpha (2026-09-17, alongside the dbt v2 migration below).
# DuckDB's own team calls alpha clients "explicitly not production-ready" --
# deliberate, not an oversight. Move to a GA release once DuckDB 2.0
# ("Cyanoptera") cuts one; don't let --pre ride indefinitely. NOTE: dbt
# itself does NOT use this package -- dbt v2's DuckDB adapter bundles its own
# engine entirely (confirmed: `dbt run` works in a venv with no `duckdb` pip
# package installed at all). This pin only affects backend/app.py,
# ops/incident.py, and build.sh's own inline publish step.
duckdb = [
    "duckdb==2.0.0.dev2609121639",
]
# dbt v2 GA'd 2026-09-14. Real manylinux_2_28 wheel -- the actual fix for the
# musl gap that kept dbt off ghost-runner entirely (dbt-core-experimental-
# parser, a v1.x hard dep, shipped no musllinux wheel and its stub build
# backend refused to compile from source on any platform). v2's `dbt`
# package turned out to use the exact same stub-wheel-fetch pattern, but its
# manifest DOES list manylinux_2_28 -- checked directly by unpacking the
# sdist, not assumed.
#
# DuckDB support is bundled into `dbt` natively now -- do NOT also install
# dbt-duckdb (PyPI has no 2.x release of it regardless; 1.11.0 is the
# ceiling, built for dbt-core v1.x's adapter interface, not Fusion's).
#
# Migrated 2026-09-17. `dbt-autofix` moved three source-level keys (`meta`,
# `loaded_at_field`, `freshness`) under `config:` in both _sources.yml
# files -- v2's parser rejects them at the old top level (see git log for
# the diff). Full `dbt run` + `dbt test` (884/884) verified clean against
# real data before this pin changed. One real regression found and fixed:
# profiles.yml's memory_limit went from 4GB to 6GB -- v2's bundled DuckDB
# engine has different memory overhead than the old dbt-duckdb adapter (two
# models that were stable at 4GB under v1.12.4 OOM'd at the same limit under
# v2; confirmed NOT data growth by rerunning the identical models under
# v1.12.4 on the same data, which still passed at 4GB). See profiles.yml.
dbt = [
    "dbt==2.0.4",
]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "detect-secrets",
    "mkdocs",
    "mkdocs-material",
    "poethepoet",
    "typer",
    "genbadge[coverage]",
    "pydoc-markdown",
]

[project.urls]
Homepage = "https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor"
Repository = "https://git.thomaspeoples.com/thomaspeoples/wraith-bus-ingestor.git"

# App, not a library -- backend/, dbt/, contracts/, ingestor/, archiver/ are
# sibling app dirs, not one src/ tree. uv only needs this file for locking
# and `uv run`, so skip building it.
[tool.uv]
package = false

[tool.poe.tasks]
test = "pytest"
test-ci = "pytest --cov=backend --cov-report=term-missing --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
tidy = ["lint", "format"]
# Regenerates docs/api.md from backend/app.py's own docstrings.
docs-api = { shell = "printf '# Python API\\n\\n' > docs/api.md && pydoc-markdown pydoc-markdown.yml >> docs/api.md" }
# dbt docs generate needs the `dbt` extra and a duckdb file to introspect --
# an empty one is fine, it just means catalog data is sparse until a real
# build has run. --static inlines manifest+catalog into one HTML file, since
# this gets served under /dbt/ (a subpath), not domain root, and the default
# multi-file output's internal fetches assume the latter.
docs-dbt = { shell = "cd dbt && ../.venv/bin/python3 ensure_ci_fixtures.py && ../.venv/bin/dbt docs generate --profiles-dir . --static && mkdir -p ../docs/dbt && cp target/static_index.html ../docs/dbt/index.html" }
docs-mkdocs = "mkdocs build"
docs-build = ["docs-api", "docs-dbt", "docs-mkdocs"]
docs-serve = "mkdocs serve"
# dbt runs under this same project-root venv now (see dbt/build.sh) -- build.sh
# just wraps the existing entry point.
build = { shell = "cd dbt && ./build.sh" }
validate = "python contracts/validate.py"

[tool.ruff]
# 99, not a default 79: this codebase's established voice is long explanatory
# prose comments, measured against the real code as fitting p99 = 99 chars.
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# This generator emits dbt YAML from triple-quoted templates. Two `description:`
# lines exceed 99 chars, but they are the emitted payload, not source: a `# noqa`
# would be written into the generated file, and wrapping them would desync the
# generator from the committed _generated_line_stops_batches.yml it produces.
"dbt/scripts/generate_line_stops_batches.py" = ["E501"]

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--cov=backend",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
]
pythonpath = ["backend"]
testpaths = ["backend"]
